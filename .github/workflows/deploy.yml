name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Test content and link checks
        run: python -m unittest discover -s tests -p "test_content_quality.py" -v

      - name: Build MkDocs
        run: python -m mkdocs build --strict

      - name: Upload artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  test-sync:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test sync with local repositories
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          $runSyncTests = $true
          if ($env:EVENT_NAME -in @('push', 'pull_request') -and $env:BASE_SHA -and $env:BASE_SHA -notmatch '^0+$') {
            $changed = @(& git -c core.quotepath=false diff --name-only "$($env:BASE_SHA)..$($env:HEAD_SHA)" 2>$null)
            if ($LASTEXITCODE -eq 0 -and $changed.Count -gt 0 -and @($changed | Where-Object { -not $_.StartsWith('docs/') }).Count -eq 0) {
              Write-Host "Only docs/ changed ($($changed.Count) files); skipping Windows sync script tests."
              $runSyncTests = $false
            }
          }
          if ($runSyncTests) {
            python -m unittest discover -s tests -v
          }

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: [build, test-sync]

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
