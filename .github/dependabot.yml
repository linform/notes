version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # MkDocs 2.x is incompatible with Material for MkDocs and existing plugins.
      - dependency-name: "mkdocs"
        versions: [">= 2.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
