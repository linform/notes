site_name: 我的学习笔记
site_url: https://linform.github.io/notes/
site_description: 学习笔记、公式推导与 Markdown 写作指南。
repo_url: https://github.com/linform/notes
repo_name: linform/notes
edit_uri: edit/main/docs/

nav:
  - 首页: index.md
  - 课程笔记:
      - 固体物理:
          - courses/solid-state/index.md
          - 第一章 · 晶体结构: courses/solid-state/structure.md
          - 第二章 · 晶体结合: courses/solid-state/bonding.md
          - 第三章 · 晶格振动: courses/solid-state/phonons.md
          - 第四章 · 能带理论:
              - 单电子模型: courses/solid-state/electron-models.md
              - 周期势与带隙: courses/solid-state/bloch.md
              - 电子统计与运动: courses/solid-state/electron-statistics.md
              - 紧束缚与石墨烯: courses/solid-state/tight-binding.md
              - 密度泛函与自洽计算: courses/solid-state/dft.md
          - 习题与解析: courses/solid-state/exercises.md
          - 复习速查与自测: courses/solid-state/review.md
          - 参考资料与订正: courses/solid-state/references.md
          - 完整阅读版: 固体物理.md
  - 参考资料:
      - resources/index.md
      - 标签索引: tags.md
  - 写作与发布:
      - guides/index.md
      - Markdown 使用手册: Markdown使用说明.md
      - 课程章节与资料模板: guides/templates.md

not_in_nav: |
  /原神.md
  /test.md

exclude_docs: |
  /courses/*/course.json
  /includes/*

hooks:
  - hooks/content_quality.py

validation:
  links:
    anchors: warn

theme:
  name: material
  language: zh
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.path
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.tooltips
    - content.footnote.tooltips
    - content.tabs.link

plugins:
  - search:
      lang:
        - zh
        - en
      separator: '[\s\u200b\-]'
  - tags
  - git-revision-date-localized:
      enable_creation_date: false
      type: iso_date
      timezone: Asia/Shanghai
      locale: zh
      fallback_to_build_date: true
      strict: false
      exclude:
        - index.md
        - 固体物理.md
        - test.md
        - 原神.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.mark
  - pymdownx.snippets:
      base_path:
        - docs
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  status:
    已整理: 已整理：正文、推导与自测已核对
    草稿: 草稿：正在整理，内容可能调整
    待补充: 待补充：尚缺部分课件或推导

extra_javascript:
  - javascripts/toc-toggle.js
  - javascripts/mathjax.js?v=20261020-instant
  - javascripts/vendor/mathjax/tex-chtml.js

extra_css:
  - stylesheets/extra.css
